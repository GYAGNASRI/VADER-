name: Execute Python Code

on:
  workflow_dispatch:

jobs:
  run-environment:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Fetch Code from Repo
        uses: actions/checkout@v4

      - name: 2. Start Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install VADER Sentiment Library
        run: |
          pip install vaderSentiment nltk

      - name: 4. Run Python File and Show Output
        run: python vader_session_sentiment_application.py
